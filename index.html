<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eef1f6;
      --ink: #14213d;
      --muted: #566079;
      --line: #c9d1e0;
      --field: #ffffff;
      --accent: #2447d8;
      --accent-ink: #ffffff;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0f1424;
        --ink: #e8ecf8;
        --muted: #9aa5c2;
        --line: #2b3558;
        --field: #171d33;
        --accent: #7b96ff;
        --accent-ink: #0f1424;
        --error: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 48px 20px;
    }
    main { width: 100%; max-width: 560px; }
    h1 {
      font-size: clamp(2rem, 6vw, 2.9rem);
      line-height: 1.08;
      letter-spacing: -0.025em;
      margin: 0 0 12px;
      font-weight: 700;
    }
    .lede { color: var(--muted); margin: 0 0 36px; max-width: 46ch; }
    form { display: grid; gap: 20px; }
    .row { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 0.95rem; }
    .hint { font-weight: 400; color: var(--muted); }
    input, select, textarea {
      font: inherit;
      color: var(--ink);
      background: var(--field);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      width: 100%;
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus-visible, select:focus-visible, textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    input:user-invalid, select:user-invalid { border-color: var(--error); }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
    .check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
    button {
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 8px;
      padding: 14px 22px;
      cursor: pointer;
      justify-self: start;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Save your spot</h1>
    <p class="lede">Fill in your details and we'll confirm your registration. It takes about a minute.</p>

    <!--
      Netlify Forms needs three things:
      1. data-netlify="true" on the form
      2. a unique name (here: "signup")
      3. the hidden form-name input below
      netlify-honeypot catches most spam bots for free.
    -->
    <form name="signup" method="POST" action="/success" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="signup">
      <p class="hidden"><label>Don't fill this out: <input name="bot-field"></label></p>

      <div class="row">
        <label>First name
          <input type="text" name="first_name" autocomplete="given-name" required>
        </label>
        <label>Last name
          <input type="text" name="last_name" autocomplete="family-name" required>
        </label>
      </div>

      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <div class="row">
        <label>Phone <span class="hint">(optional)</span>
          <input type="tel" name="phone" autocomplete="tel">
        </label>
        <label>City
          <input type="text" name="city" autocomplete="address-level2">
        </label>
      </div>

      <label>School or organization <span class="hint">(optional)</span>
        <input type="text" name="organization" autocomplete="organization">
      </label>

      <label>Anything we should know? <span class="hint">(optional)</span>
        <textarea name="notes"></textarea>
      </label>

      <label class="check">
        <input type="checkbox" name="consent" value="yes" required>
        <span>I agree to be contacted about this registration.</span>
      </label>

      <button type="submit">Register</button>
    </form>
  </main>

  <script>
    // Prevent double submits
    document.querySelector('form').addEventListener('submit', function (e) {
      var btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Registering...';
    });
  </script>
</body>
</html>
