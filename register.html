<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sign up | Meet × STEM</title><link rel="icon" href="logo-bw.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div id="nav"></div><main>
<h2>SIGN UP</h2><p class="dim">Choose an event and fill in your details. We will confirm by email.</p><br>
<form name="signup" method="POST" action="/success" data-netlify="true" netlify-honeypot="bot-field"><input type="hidden" name="form-name" value="signup"><p class="hidden"><label>Do not fill this out: <input name="bot-field"></label></p>
<label>Which event?<select name="event" required><option value="mindshift">Mindshift, the debate event (Oct 20)</option><option value="updates">Just keep me posted about future events</option></select></label>
<div class="two"><label>First name<input type="text" name="first_name" autocomplete="given-name" required></label><label>Last name<input type="text" name="last_name" autocomplete="family-name" required></label></div>
<label>Email<input type="email" name="email" autocomplete="email" required></label>
<div class="two"><label>Phone (optional)<input type="tel" name="phone" autocomplete="tel"></label><label>City<input type="text" name="city" autocomplete="address-level2"></label></div>
<label>School or organization (optional)<input type="text" name="organization" autocomplete="organization"></label>
<label>Anything we should know? (optional)<textarea name="notes" rows="4"></textarea></label>
<label class="chk"><input type="checkbox" name="consent" value="yes" required><span>I agree to be contacted about this registration.</span></label><button type="submit">SIGN UP</button></form>
</main><div id="foot"></div><script src="app.js"></script></body></html>
