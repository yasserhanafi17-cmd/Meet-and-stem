<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're registered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #eef1f6; --ink: #14213d; --muted: #566079; --accent: #2447d8; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #0f1424; --ink: #e8ecf8; --muted: #9aa5c2; --accent: #7b96ff; }
    }
    html { background: var(--paper); }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink); line-height: 1.55;
    }
    main { max-width: 480px; }
    h1 { font-size: clamp(2rem, 6vw, 2.6rem); letter-spacing: -0.025em; line-height: 1.1; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>You're registered</h1>
    <p>Thanks, we've received your details and will be in touch soon.</p>
    <a href="/">Back to the form</a>
  </main>
</body>
</html>
